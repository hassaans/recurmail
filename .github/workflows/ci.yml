name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Typecheck, lint, unit and browser tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.18.3
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e

  database-tests:
    name: Database tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.120.0
      - name: Start Supabase database
        run: supabase start -x gotrue,realtime,storage-api,imgproxy,kong,mailpit,postgrest,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
      - name: Run pgTAP database tests
        shell: bash
        run: |
          test_db_url="$(supabase status | python3 -c '
          import sys
          from urllib.parse import parse_qsl, unquote, urlencode, urlsplit, urlunsplit

          line = next((line for line in sys.stdin if line.lstrip().startswith("DB URL:")), "")
          value = line.split(":", 1)[1].strip() if line else ""
          parsed = urlsplit(value)
          password = unquote(parsed.password or "")
          if not password:
              raise SystemExit("local database URL did not include a password")
          query = dict(parse_qsl(parsed.query, keep_blank_values=True))
          query["options"] = f"-c hq.test_db_password={password}"
          print(urlunsplit(parsed._replace(query=urlencode(query))))
          ')"
          supabase test db --db-url "$test_db_url"
      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.6
      - name: Run sender Edge Function tests
        run: deno test --no-check --node-modules-dir=none --lock=supabase/functions/deno.lock --allow-env --allow-read --allow-net --allow-run --import-map=supabase/functions/import_map.json supabase/functions/send-due
  secret-scan:
    name: Gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false
